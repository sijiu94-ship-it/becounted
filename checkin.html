<div class="pagehead">

    <h1 data-i18n="h_ci"></h1>

<section>
  <div class="wrap">
    <div class="panel" id="checkinBox" style="max-width:760px">
      <div id="ciSoon" style="display:none">
        <h3 data-i18n="ci_soon_h" style="font-size:19px;margin-bottom:10px"></h3>
        <p style="color:var(--muted);font-size:15px;line-height:1.65" data-i18n="ci_soon"></p>
      </div>
      <div id="ciMain">
        <div class="ci-bj"><span data-i18n="ci_bj"></span> · <span id="ciToday">—</span></div>
        <div class="ci-status" id="ciStatus">…</div>
        <div class="ci-grid">
          <div class="ci-stat"><b id="ciTotal">—</b><span data-i18n="ci_stat_total"></span></div>
          <div class="ci-stat"><b id="ciWindow">—</b><span data-i18n="ci_stat_window"></span></div>
          <div class="ci-stat"><b id="ciWeight">—</b><span data-i18n="ci_stat_weight"></span></div>
        </div>
        <div class="ci-formula" data-i18n="ci_weight_formula"></div>
        <div class="ci-next"><span data-i18n="ci_stat_next"></span><span class="ci-count" id="ciCount">--:--:--</span></div>
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <button class="btn big" id="ciBtn" data-i18n="ci_btn"></button>
          <span class="camp-msg" id="ciMsg"></span>
        </div>
      </div>

  </div>
</section>
<section>
  <div class="wrap">

      <div id="ciBoard"></div>
    </div>
  </div>
</section>
