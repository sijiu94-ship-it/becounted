<div class="pagehead">
  <div class="wrap">

    <h1 data-i18n="h_create"></h1>
    <p data-i18n="create_sub"></p>
  </div>
</div>
<section>
  <div class="wrap">
    <div class="create-grid">
    <div class="form">
      <div class="tabs">
        <button type="button" class="on" data-i18n="f_tab_raffle"></button>
        <button type="button" data-i18n="f_tab_vote"></button>
        <button type="button" data-i18n="f_tab_claim"></button>
      </div>
      <div class="f-sec" data-i18n="f_sec1"></div>
      <div class="f-row">
        <label data-i18n="f_title"></label>
        <input id="fTitle" data-i18n-ph="f_title_ph" spellcheck="false">
      </div>
      <div class="f-2col">
        <div class="f-row"><label data-i18n="f_start"></label><input id="fStart" type="datetime-local"></div>
        <div class="f-row"><label data-i18n="f_end"></label><input id="fEnd" type="datetime-local"></div>
      </div>
      
      <div class="f-sec" data-i18n="f_sec2"></div>
      <div class="f-row" id="fPrizeRow">
        <label data-i18n="f_prize_token"></label>
        <select id="fTokenSel">
          <option value="none" data-i18n="f_tok_none"></option>
          <option value="bnb" data-i18n="f_tok_bnb"></option>
          <option value="usdt" data-i18n="f_tok_usdt"></option>
          <option value="usdc" data-i18n="f_tok_usdc"></option>
          <option value="erc20" data-i18n="f_tok_erc20"></option>
          <option value="custom" data-i18n="f_tok_custom"></option>
        </select>
      </div>
      <div class="f-row" id="fTokenAddrRow" style="display:none">
        <label data-i18n="f_token_addr"></label>
        <input id="fTokenAddr" placeholder="0x…" spellcheck="false">
      </div>
      <div class="f-row" id="fPrizeLabelRow" style="display:none">
        <label data-i18n="f_prize_label"></label>
        <input id="fPrizeLabel" data-i18n-ph="f_prize_label_ph" maxlength="80" autocomplete="off">
        <div class="hint" data-i18n="f_custom_hint"></div>
      </div>
      <div class="f-row" id="fWinnersRow">
        <label data-i18n="f_winners"></label>
        <input id="fWinners" type="number" min="1" value="1">
        <div class="hint" data-i18n="f_prize_hint"></div>
      </div>
      
      
      <div class="f-row" id="fModeRow" style="display:none">
        <label data-i18n="f_mode"></label>
        <div class="tabs" style="margin-bottom:8px">
          <button type="button" id="fModeFixed" class="on" data-i18n="f_mode_fixed"></button>
          <button type="button" id="fModeRandom" data-i18n="f_mode_random"></button>
        </div>
        <div class="hint" data-i18n="f_mode_hint"></div>
      </div>
      <div class="f-row" id="fPoolRow" style="display:none">
        <label data-i18n="f_pool"></label>
        <input id="fPool" type="text" inputmode="decimal" placeholder="0.1">
      </div>
      <div class="f-row" id="fMaxClaimsRow" style="display:none">
        <label data-i18n="f_maxclaims"></label>
        <input id="fMaxClaims" type="number" min="1" value="10">
      </div>
      <div class="f-row" id="fPerWinnerRow" style="display:none">
        <label data-i18n="f_per_winner"></label>
        <input id="fPerWinner" type="text" inputmode="decimal" placeholder="0.01">
      </div>
      <div class="f-row" id="fOptionsRow" style="display:none">
        <label data-i18n="f_options"></label>
        <input id="fOptions" type="number" min="2" max="16" value="2">
      </div>
      <div class="f-row" id="fOptLabelsRow" style="display:none">
        <label data-i18n="f_opt_labels"></label>
        <div id="fOptLabels" style="flex:1;display:flex;flex-direction:column;gap:6px"></div>
      </div>
      <div class="f-row" id="fVPrizeRow" style="display:none"><label><input type="checkbox" id="fVPrizeOn" onchange="toggleVPrize()"> <span data-i18n="vp_on"></span></label><div class="hint" data-i18n="vp_note"></div></div>
      <div class="f-row" id="fVTotalRow" style="display:none">
        <label data-i18n="vp_total"></label>
        <input id="fVTotal" type="text" inputmode="decimal" placeholder="10">
      </div>
      <div class="f-row" id="fVWinnersRow" style="display:none">
        <label data-i18n="vp_winners"></label>
        <input id="fVWinners" type="number" min="1" value="3">
      </div>
      <div class="f-row" id="fSeedHint"><div class="hint" data-i18n="f_seed_hint"></div></div>
      <div class="f-sec" data-i18n="f_sec3"></div>
      <div class="f-row"><label data-i18n="f_posturl"></label><input type="text" id="fPostUrl" data-i18n-ph="post_ph" autocomplete="off"></div>
      <div class="f-row"><label data-i18n="f_series"></label><input type="text" id="fSeries" data-i18n-ph="series_ph" autocomplete="off"></div>
      <div class="f-sec" data-i18n="cd_sec"></div>
      <div class="f-row"><label><input type="checkbox" id="cdBind"> <span data-i18n="cd_bind"></span></label></div>
      <div class="f-row"><label><input type="checkbox" id="cdTokenOn"> <span data-i18n="cd_token"></span></label><input id="cdTokenAddr" placeholder="0x…" spellcheck="false" style="flex:1"><input id="cdTokenMin" type="text" inputmode="decimal" placeholder="100" style="width:90px"></div>
      <div class="f-row"><label></label><label style="font-weight:400"><input type="checkbox" id="cdToken721" onchange="toggle721()"> <span data-i18n="cd_721"></span></label></div>
      <div class="f-row" id="cd721Hint" style="display:none"><label></label><div class="hint" data-i18n="cd_721_hint"></div></div>
      <div class="f-row"><label><input type="checkbox" id="cdPriorOn"> <span data-i18n="cd_prior"></span></label><input id="cdPriorId" type="number" min="0" placeholder="0" style="width:90px"></div>
      <div class="f-row"><label><input type="checkbox" id="cdStampOn"> <span data-i18n="cd_stamps"></span></label><input id="cdStampMin" type="number" min="1" max="7" value="5" style="width:90px"></div>
      <div class="f-row"><label><input type="checkbox" id="cdAllowOn" onchange="toggleAllow()"> <span data-i18n="cd_allow"></span></label></div>
      <div class="f-row" id="cdAllowRow" style="display:none"><label data-i18n="cd_allow_list"></label><textarea id="cdAllowList" rows="4" data-i18n-ph="cd_allow_ph" spellcheck="false" style="flex:1" oninput="updAllowCount()"></textarea></div>
      <div class="f-row" id="cdAllowMeta" style="display:none"><label></label><span class="hint" id="cdAllowCount"></span><button type="button" class="btn sm ghost" onclick="dlAllowList()" data-i18n="cd_allow_dl"></button></div>
      <div class="f-row"><div class="hint" data-i18n="cd_hint"></div></div>
      <div id="fErrors" style="display:none;color:#ff8a8a;font-size:13.5px;line-height:1.75;margin-bottom:10px"></div>
      <button class="btn" id="createSubmit" data-i18n="f_submit_raffle"></button>
      <span class="camp-msg" id="formMsg"></span>
    </div>
    <aside class="create-side">
    <div class="f-sec" data-i18n="f_preview"></div>
    <div id="createPreview"></div>
    </aside>
    </div>
  </div>
</section>
