<script>
(function(){
  var SKILL_URL = "https://becounted.9nosing.com/becounted-skill.md";
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function inline(s){
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/\u0001(\d+)\u0001/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  function renderMd(md){
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var out = [], para = [], list = null, quote = [], table = [], code = null;
    function flushPara(){ if (para.length){ out.push("<p>" + inline(esc(para.join("\n"))) + "</p>"); para = []; } }
    function flushList(){ if (list){ out.push("<" + list.type + ">" + list.items.map(function(x){ return "<li>" + inline(esc(x)) + "</li>"; }).join("") + "</" + list.type + ">"); list = null; } }
    function flushQuote(){
      if (!quote.length) return;
      var blocks = [], cur = [];
      function flushCur(){ if (cur.length){ blocks.push("<p>" + inline(esc(cur.join("\n"))) + "</p>"); cur = []; } }
      for (var i = 0; i < quote.length; i++){
        var q = quote[i], h = q.match(/^#{1,6}\s+(.*)/);
        if (h){ flushCur(); blocks.push('<p class="md-qh">' + inline(esc(h[1])) + "</p>"); }
        else if (!q.trim()) flushCur();
        else cur.push(q);
      }
      flushCur();
      out.push("<blockquote>" + blocks.join("") + "</blockquote>");
      quote = [];
    }
    function flushTable(){
      if (!table.length) return;
      var rows = table.map(function(l){ return l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function(c){ return c.trim(); }); });
      table = [];
      var body = rows.filter(function(r){ return !r.every(function(c){ return /^:?-+:?$/.test(c); }); });
      if (!body.length) return;
      var h = "<table><thead><tr>" + body[0].map(function(c){ return "<th>" + inline(esc(c)) + "</th>"; }).join("") + "</tr></thead><tbody>";
      for (var i = 1; i < body.length; i++) h += "<tr>" + body[i].map(function(c){ return "<td>" + inline(esc(c)) + "</td>"; }).join("") + "</tr>";
      out.push(h + "</tbody></table>");
    }
    function flushAll(){ flushPara(); flushList(); flushQuote(); flushTable(); }
    for (var n = 0; n < lines.length; n++){
      var line = lines[n];
      if (code !== null){
        if (/^\s*```/.test(line)){ out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
        else code.push(line);
        continue;
      }
      if (/^\s*```/.test(line)){ flushAll(); code = []; continue; }
      if (!line.trim()){ flushAll(); continue; }
      var hm = line.match(/^(#{1,6})\s+(.*)/);
      if (hm){ flushAll(); var lv = Math.min(hm[1].length, 4); out.push("<h" + lv + ">" + inline(esc(hm[2])) + "</h" + lv + ">"); continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ flushAll(); out.push("<hr>"); continue; }
      var qm = line.match(/^>\s?(.*)/);
      if (qm){ flushPara(); flushList(); flushTable(); quote.push(qm[1]); continue; }
      if (/^\s*\|/.test(line)){ flushPara(); flushList(); flushQuote(); table.push(line); continue; }
      var um = line.match(/^\s*[-*]\s+(.*)/);
      if (um){ flushPara(); flushQuote(); flushTable(); if (!list || list.type !== "ul"){ flushList(); list = { type: "ul", items: [] }; } list.items.push(um[1]); continue; }
      var om = line.match(/^\s*\d+[.)]\s+(.*)/);
      if (om){ flushPara(); flushQuote(); flushTable(); if (!list || list.type !== "ol"){ flushList(); list = { type: "ol", items: [] }; } list.items.push(om[1]); continue; }
      if (/^\s{2,}\S/.test(line) && list){ list.items[list.items.length - 1] += "\n" + line.trim(); continue; }
      flushList(); flushQuote(); flushTable();
      para.push(line);
    }
    if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
    flushAll();
    return out.join("\n");
  }
  var box = document.getElementById("skillDoc");
  fetch("becounted-skill.md").then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.text(); })
    .then(function(md){ box.innerHTML = renderMd(md); })
    .catch(function(){ box.innerHTML = '<p class="md-fail"><a href="becounted-skill.md" data-i18n="skill_raw_open"></a></p>'; if (typeof applyI18n === "function") applyI18n(); });
  var btn = document.getElementById("copySkillBtn");
  function fallbackCopy(){
    var ta = document.createElement("textarea");
    ta.value = SKILL_URL; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(t(ok ? "skill_copied" : "skill_copy_fail"));
  }
  btn.addEventListener("click", function(){
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(SKILL_URL).then(function(){ toast(t("skill_copied")); }, fallbackCopy);
    else fallbackCopy();
  });
})();
</script>
