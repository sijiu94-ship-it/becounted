      <img class="brand-ic" src="assets/icon-192.png" alt="">

        <button type="button" class="nav-dd-btn" id="learnBtn" aria-haspopup="true" aria-expanded="false"><span data-i18n="nav_learn"></span> <span>▾</span></button>

      <button class="btn connectBtn" data-i18n="connect"></button>
  </div>

<div class="pagehead">
  <div class="wrap">
    <div class="kicker" data-i18n="kick_card"></div>
    <h1 data-i18n="h_card"></h1>
    <p data-i18n="card_sub"></p>
  </div>
</div>
<section>
  <div class="wrap">
    <div class="card-form">
      <input id="cardInput" placeholder="0x…" spellcheck="false" aria-label="Wallet address to look up · 要查询的钱包地址">
      <button class="btn" id="cardBtn" data-i18n="card_btn"></button>
    </div>
    <div class="idcard">
      <div class="idhead">
        <canvas id="cardAvatar" width="110" height="110" aria-hidden="true"></canvas>
        <div>
          <div class="row1">
            <span class="lbl" data-i18n="card_lbl"></span>
            <span class="status none" id="cardStatus" data-i18n="card_not"></span>
          </div>
          <div id="cardName">—</div>
          <div class="addr" id="cardAddr">—</div>
          <div id="cardBinding"></div>
        </div>
      </div>
      <p class="note" id="cardNote" data-i18n="card_note0"></p>
    </div>
    <div class="panel" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px">
      <div style="flex:1;min-width:220px">
        <h3 style="font-weight:700;font-size:16px" data-i18n="card_bind_h"></h3>
        <div class="mono" id="bindEntryStatus" data-i18n="card_bind_none" style="color:var(--muted);font-size:13px;margin-top:3px"></div>
      </div>
      <a class="btn ghost" href="bind.html" data-i18n="card_bind_go" style="text-decoration:none"></a>
    </div>
    <div class="panel" id="cardQrPanel" style="display:none;margin-top:16px;align-items:center;gap:16px">
      <canvas id="cardQr" width="132" height="132" style="border-radius:8px;background:#fff;flex:none" role="img" aria-label="Card QR code · 名片二维码"></canvas>
      <div>
        <h3 style="font-weight:700;font-size:16px" data-i18n="qr_h"></h3>
        <div class="mono" style="color:var(--muted);font-size:12.5px;margin-top:4px" data-i18n="qr_sub"></div>
      </div>
    </div>
    <div class="panel" id="profileBox" style="display:none;margin-top:16px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="font-weight:700;font-size:16px" data-i18n="prof_h"></h3>
        <span style="color:var(--gold);font-size:12px;border:1px solid rgba(240,185,11,.45);border-radius:99px;padding:2px 8px" data-i18n="prof_self"></span>
      </div>
      <p id="profileBio" style="margin:10px 0 0;line-height:1.65"></p>
      <div id="profileLinks" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div>
      <div class="mono" data-i18n="prof_note" style="color:var(--muted);font-size:12px;margin-top:12px"></div>
    </div>
    <div class="panel" id="profileEdit" style="display:none;margin-top:16px">
      <h3 style="font-weight:700;font-size:16px" data-i18n="prof_edit_h"></h3>
      <div class="f-row" style="margin-top:12px"><label for="pfBio" data-i18n="prof_bio"></label><input id="pfBio" data-i18n-ph="prof_bio_ph" spellcheck="false"></div>
      <div id="pfLinks"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="pfSave" data-i18n="prof_save"></button>
        <button class="btn ghost" id="pfRemove" data-i18n="prof_remove"></button>
        <span class="camp-msg" id="pfMsg"></span>
      </div>
    </div>


    <div class="guide claimGuide" style="display:none">
      <h3 data-i18n="guide_h"></h3>
      <ol>
        <li data-i18n="guide_1"></li>
        <li data-i18n="guide_2"></li>
        <li data-i18n="guide_3"></li>
        <li data-i18n="guide_4"></li>
      </ol>
    </div>
    <div style="height:26px"></div>
    <div class="sec-head"><h2 data-i18n="rec_h" style="font-size:22px"></h2></div>

    <div id="shareCardBtns" style="display:none;margin-top:20px">
      <button class="btn" id="makeCardBtn" data-i18n="card_img_btn"></button>
      <button class="btn ghost" id="copyLinkBtn" data-i18n="card_copy_link"></button>
      <div id="shareCardBox" style="display:none;margin-top:16px">
        <canvas id="shareCanvas" width="1200" height="630" style="width:100%;max-width:680px;border-radius:12px;border:1px solid var(--line)" role="img" aria-label="Share card image · 分享名片图"></canvas>
        <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
          <a class="btn sm" id="shareDl" download="becounted-card.png" data-i18n="card_img_dl" style="text-decoration:none"></a>
          <button class="btn sm ghost" onclick="shareCardPost()" data-i18n="card_img_share"></button>
        </div>
      </div>
    </div>
    <div id="recordBox"><div class="empty" data-i18n="rec_prompt"></div></div>
  </div>
</section>

<footer>
  <div class="wrap f-in">
    <div data-i18n="foot_l"></div>
    <div class="mono" data-i18n="foot_r"></div>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="assets/app.js?v=1122x"></script>
<noscript><p style="text-align:center;padding:16px 20px;color:#9a9aa3;font-size:14px">BeCounted needs JavaScript enabled to run. · BeCounted 需要启用 JavaScript 才能使用。</p></noscript>
</body>
</html>
