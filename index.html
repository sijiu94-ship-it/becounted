<div class="marquee"><div class="marquee-track" id="mqTrack"></div></div>
<script>
(function(){
  const keys=['mq1','mq2','mq3','mq4','mq5','mq6'];
  function fill(){
    const lang = localStorage.getItem('hg-lang') || ((navigator.language||'en').startsWith('zh')?'zh':'en');
    const dict = window.__HG_DICTS && window.__HG_DICTS[lang];
    if(!dict){ document.getElementById('mqTrack').innerHTML=''; return; }
    const items = keys.map(k=>'<span>'+dict[k]+'</span>').join('<b>·</b>');
    document.getElementById('mqTrack').innerHTML = items + '<b>·</b>' + items + '<b>·</b>';
  }
  window.__mqFill = fill; fill();
})();
</script>
